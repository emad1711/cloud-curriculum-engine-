<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>محرك المناهج التفاعلية</title><style>
:root{font-family:Tahoma,Arial,sans-serif;color:#182230;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:920px;margin:38px auto;padding:18px}.hero{background:linear-gradient(135deg,#123d36,#167c68);color:white;padding:30px;border-radius:22px}.hero h1{margin:0 0 10px;font-size:28px}.card{background:white;border:1px solid #e3e9f0;border-radius:18px;padding:22px;margin-top:18px;box-shadow:0 8px 25px #1020300a}label{display:block;font-weight:bold;margin:12px 0 7px}input,select{width:100%;padding:13px;border:1px solid #ccd5df;border-radius:10px;background:white}button{background:#167c68;color:white;border:0;padding:13px 20px;border-radius:10px;font-weight:bold;cursor:pointer;margin-top:16px}button:disabled{opacity:.5}pre{white-space:pre-wrap;word-break:break-word;background:#f5f7fa;padding:14px;border-radius:10px;direction:ltr;text-align:left;max-height:380px;overflow:auto}.muted{color:#667085}.status{margin-top:14px;line-height:1.8}.tag{display:inline-block;background:#e3f5ef;color:#12634f;padding:5px 10px;border-radius:99px;font-size:12px}</style></head><body><main class="wrap"><header class="hero"><span class="tag">نسخة تجريبية 0.1</span><h1>من الكتاب إلى منهج تفاعلي</h1><p>ارفع كتاب الرياضيات للصف الرابع السعودي، وسيقوم المحرك باستخراج محتواه وتجهيزه للتحويل إلى دروس.</p></header><section class="card"><h2>١. رفع الكتاب</h2><label>ملف PDF</label><input id="file" type="file" accept="application/pdf"><button id="upload">رفع وتحليل الكتاب</button><div id="uploadStatus" class="status muted"></div></section><section class="card"><h2>٢. توليد درس تفاعلي</h2><label>عنوان الدرس</label><input id="title" placeholder="القيمة المنزلية ضمن مئات الألوف"><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div><label>من صفحة PDF</label><input id="pageStart" type="number" min="1" placeholder="14"></div><div><label>إلى صفحة PDF</label><input id="pageEnd" type="number" min="1" placeholder="16"></div></div><button id="generate" disabled>توليد الدرس باستخدام Gemini</button><div id="lessonStatus" class="status muted"></div><pre id="output" hidden></pre></section><p class="muted">المحتوى المولد مسودة تحتاج مراجعة مقابل صفحات الكتاب قبل اعتماده.</p></main><script>
let docId=null;const $=id=>document.getElementById(id);$('upload').onclick=async()=>{const f=$('file').files[0];if(!f){$('uploadStatus').textContent='اختر ملف PDF أولاً';return}$('upload').disabled=true;$('uploadStatus').textContent='جارٍ رفع الكتاب واستخراج الصفحات...';try{const fd=new FormData();fd.append('file',f);fd.append('curriculum','السعودي');fd.append('grade','الرابع الابتدائي');fd.append('subject','الرياضيات');const r=await fetch('/api/books/upload',{method:'POST',body:fd});const d=await r.json();if(!r.ok)throw Error(d.detail||'حدث خطأ');docId=d.document_id;$('uploadStatus').textContent='تم استلام الكتاب. يجري تحليل الصفحات في الخلفية...';let status;for(let i=0;i<240;i++){await new Promise(res=>setTimeout(res,3000));const sr=await fetch(`/api/books/${docId}/status`);status=await sr.json();if(status.status==='ready'||status.status==='failed')break;$('uploadStatus').textContent=`جارٍ تحليل الكتاب... (${i+1})`}if(status.status==='failed')throw Error(status.error||'فشل تحليل الكتاب');if(status.status!=='ready')throw Error('ما زالت المعالجة مستمرة. احتفظ بمعرّف الكتاب وأعد فتح الصفحة لاحقًا.');$('generate').disabled=false;$('uploadStatus').innerHTML=`اكتمل التحليل. عدد الصفحات: <b>${status.page_count}</b>، صفحات بها نص مستخرج: <b>${status.pages_with_text}</b>، تحتاج مراجعة OCR: <b>${status.ocr_review_pages.length}</b><br>معرّف الكتاب: <code>${docId}</code>`}catch(e){$('uploadStatus').textContent=e.message}finally{$('upload').disabled=false}};$('generate').onclick=async()=>{if(!docId)return;$('generate').disabled=true;$('lessonStatus').textContent='جارٍ تجهيز الدرس...';$('output').hidden=true;try{const r=await fetch('/api/lessons/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({document_id:docId,lesson_title:$('title').value||null,page_start:$('pageStart').value?Number($('pageStart').value):null,page_end:$('pageEnd').value?Number($('pageEnd').value):null})});const d=await r.json();if(!r.ok)throw Error(d.detail||'حدث خطأ');$('output').textContent=JSON.stringify(d,null,2);$('output').hidden=false;$('lessonStatus').innerHTML='تم توليد مسودة الدرس. الصفحات المصدر: '+d.source_pages.join('، ')+'<br><a target="_blank" rel="noopener" href="/api/lessons/'+d.lesson_id+'/student">افتح الدرس التفاعلي للطفل</a>'}catch(e){$('lessonStatus').textContent=e.message}finally{$('generate').disabled=false}};
</script></body></html>
