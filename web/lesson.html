<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>درس تفاعلي</title><style>
:root{font-family:Tahoma,Arial,sans-serif;color:#172b27;background:#f3f8f6}*{box-sizing:border-box}body{margin:0}.wrap{max-width:850px;margin:25px auto;padding:16px}.hero{background:linear-gradient(135deg,#123d36,#16836d);color:#fff;padding:25px;border-radius:22px}.card{background:white;padding:20px;border:1px solid #e2ece8;border-radius:18px;margin:15px 0}.muted{color:#64756f}.pill{display:inline-block;background:#e3f5ed;color:#12634f;padding:5px 10px;border-radius:30px;font-size:12px}.example,.activity{background:#f6faf8;padding:14px;border-radius:12px;margin:10px 0}.choice{display:block;width:100%;text-align:right;background:#fff;color:#172b27;border:1px solid #d5e4de;padding:12px;border-radius:10px;margin:8px 0;cursor:pointer}.choice:hover{border-color:#16836d}.choice.correct{background:#e4f8eb;border-color:#24975c}.choice.wrong{background:#fff0ef;border-color:#d65c50}.btn{background:#16836d;color:white;border:0;border-radius:10px;padding:12px 18px;cursor:pointer}.source{font-size:13px;color:#66776f}.bar{height:8px;background:#e1ebe6;border-radius:9px;overflow:hidden}.bar>i{display:block;height:100%;width:0;background:#16836d}.hidden{display:none}</style></head><body><main class="wrap"><header class="hero"><span class="pill">رحلة تعلم تفاعلية</span><h1 id="title">جارٍ تحميل الدرس...</h1><p id="intro"></p><div class="bar"><i id="progress"></i></div></header><div id="content"></div><section class="card"><h2>اختبر فهمك ⭐</h2><div id="quiz"></div><p id="result" aria-live="polite"></p><button class="btn" onclick="location.href='/'">العودة للمكتبة</button></section><p class="source" id="sources"></p></main><script>
const lessonId='__LESSON_ID__';const $=x=>document.getElementById(x);let total=0,done=0,score=0;
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function progress(){ $('progress').style.width=(total?Math.round(done/total*100):0)+'%'; }
function renderQuiz(qs){$('quiz').innerHTML='';total=qs.length;qs.forEach((q,i)=>{const box=document.createElement('div');box.className='activity';box.innerHTML=`<b>${i+1}. ${esc(q.question)}</b>`;const choices=q.choices||q.options||[];choices.forEach((choice,j)=>{const b=document.createElement('button');b.className='choice';b.textContent=choice;b.onclick=()=>{if(box.dataset.done)return;box.dataset.done='1';const correct=Number(q.correct_index)===j||String(q.correct_answer)===String(choice)||String(q.correct_answer)===String(j);b.classList.add(correct?'correct':'wrong');if(correct){score++;$('result').textContent='أحسنت! إجابة صحيحة 🎉'}else{$('result').textContent='حاول مرة أخرى في السؤال القادم. '+(q.explanation||'')}done++;progress();};box.appendChild(b)});$('quiz').appendChild(box)});progress()}
async function init(){try{const r=await fetch('/api/lessons/'+lessonId);if(!r.ok)throw Error('تعذر تحميل الدرس');const d=await r.json();$('title').textContent=d.title||'درسنا اليوم';$('intro').textContent=d.short_explanation||d.introduction||'';const c=$('content');(d.learning_goals||[]).forEach(x=>{const p=document.createElement('p');p.textContent='🎯 '+x;c.appendChild(p)});(d.explanation||[]).forEach(x=>{const sec=document.createElement('section');sec.className='card';sec.innerHTML=`<h2>${esc(x.heading||'لنتعلم')}</h2><p>${esc(x.content||'')}</p>`;c.appendChild(sec)});(d.key_terms||[]).forEach(x=>{const p=document.createElement('p');p.textContent='💡 '+(typeof x==='string'?x:(x.term+': '+x.definition));c.appendChild(p)});(d.worked_examples||[]).forEach(x=>{const sec=document.createElement('section');sec.className='card';sec.innerHTML=`<h2>مثال محلول</h2><p><b>${esc(x.question)}</b></p><ol>${(x.steps||[]).map(s=>'<li>'+esc(s)+'</li>').join('')}</ol><p>${esc(x.explanation||x.answer||'')}</p>`;c.appendChild(sec)});const qs=d.quiz||[];renderQuiz(qs);$('sources').textContent='مصدر الدرس: صفحات الكتاب '+(d.source_pages||[]).join('، '); }catch(e){$('title').textContent='حدث خطأ';$('intro').textContent=e.message}}
init();
</script></body></html>
